<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Currency Converter</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <h2>Currency Converter</h2>

    <input id="amount" type="number" step="0.01" placeholder="Enter amount" />

    <div class="row">
      <select id="input_ticker">
        <option>USD</option><option>EUR</option><option>INR</option>
        <option>GBP</option><option>JPY</option>
      </select>

      <button id="swap" title="Swap">⇄</button>

      <select id="output_ticker">
        <option>INR</option><option>USD</option><option>EUR</option>
        <option>GBP</option><option>JPY</option>
      </select>
    </div>

    <button id="go">Convert</button>

    <div id="result-box" class="hidden">
      <p id="result"></p>
    </div>
  </div>

  <script src="/script.js" defer></script>
</body>
</html>
